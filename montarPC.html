<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monte seu PC | PixelGear</title>
  <link rel="stylesheet" href="script.css">
  <script src="theme.js" defer></script>
</head>
<body class="inner-page">
  <header class="inner-header">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-mark">P</span><span>Pixel<span>Gear</span></span></a>
      <a href="index.html" style="font-size:12px;color:#777b84">← Voltar para a loja</a>
    </div>
  </header>

  <main class="configurator">
    <h1 class="page-title">Monte seu computador</h1>
    <form action="index.html">
      <fieldset>
        <legend>Componentes essenciais</legend>
        <label for="processador">Processador</label>
        <select id="processador" name="processador" required>
          <option value="">Selecione um processador</option>
          <option>Intel Core i5-12600K</option>
          <option>AMD Ryzen 5 7600X</option>
          <option>AMD Ryzen 7 7800X</option>
        </select>
        <label for="placa_mae">Placa-mãe</label>
        <select id="placa_mae" name="placa_mae" required>
          <option value="">Selecione uma placa-mãe</option><option>Intel B660</option><option>AMD X570</option><option>AMD X670</option>
        </select>
        <label for="armazenamento">Armazenamento</label>
        <select id="armazenamento" name="armazenamento" required>
          <option value="">Selecione o armazenamento</option><option>SSD 480GB</option><option>SSD NVMe 1TB</option><option>SSD NVMe 2TB</option>
        </select>
        <label for="ram">Memória RAM</label>
        <select id="ram" name="ram" required>
          <option value="">Selecione a memória</option><option>8GB DDR4</option><option>16GB DDR5</option><option>32GB DDR5</option>
        </select>
        <label for="placa_video">Placa de vídeo</label>
        <select id="placa_video" name="placa_video" required>
          <option value="">Selecione uma placa de vídeo</option><option>NVIDIA RTX 3060</option><option>NVIDIA RTX 4070</option><option>NVIDIA RTX 4090</option>
        </select>
        <label for="fonte">Fonte de alimentação</label>
        <select id="fonte" name="fonte" required>
          <option value="">Selecione uma fonte</option><option>500W</option><option>650W</option><option>850W</option>
        </select>

        <label>Refrigeração</label>
        <div class="cooler-options">
          <label><input type="radio" name="tipo_cooler" value="air" onclick="alternarPerguntas()"> Air cooler</label>
          <label><input type="radio" name="tipo_cooler" value="water" onclick="alternarPerguntas()"> Water cooler</label>
        </div>
        <div id="bloco-air" class="pergunta-dinamica">
          <label for="select-air">Modelo do Air Cooler</label>
          <select id="select-air"><option>Cooler Master Hyper H412R</option><option>DeepCool AK400</option><option>Noctua NH-D15</option></select>
        </div>
        <div id="bloco-water" class="pergunta-dinamica">
          <label for="select-water">Modelo do Water Cooler</label>
          <select id="select-water"><option>Corsair iCUE H100i</option><option>NZXT Kraken 240</option><option>Rise Mode Aura Frost</option></select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Montagem e adicionais</legend>
        <label class="checkbox-line"><input type="radio" name="montagem" value="sim" checked> O PC deve ser entregue montado e testado</label>
        <label class="checkbox-line"><input type="radio" name="montagem" value="nao"> Desejo receber os componentes separados</label>
        <label class="checkbox-line"><input type="checkbox" name="caixa" checked> Entregar na embalagem original</label>
        <label class="checkbox-line"><input type="checkbox" name="garantia"> Adicionar garantia estendida de 12 meses</label>
      </fieldset>

      <fieldset>
        <legend>Entrega</legend>
        <label for="entrega">Endereço completo</label>
        <textarea id="entrega" name="entrega" required placeholder="Rua, número, bairro, cidade e CEP"></textarea>
        <label for="foto_referencia">Foto opcional da residência</label>
        <input id="foto_referencia" type="file" accept="image/*" style="height:auto;padding:10px 0;border:0">
      </fieldset>

      <div class="configurator-actions"><button class="button button-primary" type="submit">Salvar configuração</button></div>
    </form>
  </main>

  <script>
    function alternarPerguntas() {
      const opcao = document.querySelector('input[name="tipo_cooler"]:checked').value;
      document.getElementById('bloco-air').style.display = opcao === 'air' ? 'block' : 'none';
      document.getElementById('bloco-water').style.display = opcao === 'water' ? 'block' : 'none';
    }
  </script>
</body>
</html>
