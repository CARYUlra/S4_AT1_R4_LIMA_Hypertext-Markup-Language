<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PixelGear</title>
  <link rel="stylesheet" href="script.css">
  <script src="theme.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-art">
      <div class="login-art-content">
        <a class="brand" href="index.html"><span class="brand-mark">P</span><span>Pixel<span>Gear</span></span></a>
        <p>Seu próximo setup começa aqui.</p>
      </div>
    </section>

    <form class="login-form" action="index.html">
      <h1>Bem-vindo</h1>
      <p>Acesse sua conta para acompanhar pedidos.</p>
      <label class="form-field"><span>E-mail ou CPF</span><input type="text" name="login" placeholder="Digite seu acesso" required></label>
      <label class="form-field"><span>Senha</span><input type="password" name="senha" placeholder="Digite sua senha" required></label>
      <button class="button button-primary" type="submit">Entrar na minha conta</button>
      <a class="login-back" href="index.html">← Voltar para a loja</a>
    </form>
  </main>
</body>
</html>
